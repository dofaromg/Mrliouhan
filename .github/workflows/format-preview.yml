name: Format Preview

on:
  push:
    branches:
      - mrliouhan/causal-reversal-world-rebuild-2026-08-03

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install pre-commit black==23.1.0 isort==5.12.0 autoflake==2.0.1
      - name: Print formatter changes
        shell: bash
        run: |
          set +e
          pre-commit run --all-files
          echo '--- FORMAT DIFF START ---'
          git diff -- tools/mrliouhan_recovery.py tests/test_mrliouhan_recovery.py
          echo '--- FORMAT DIFF END ---'
          exit 0
